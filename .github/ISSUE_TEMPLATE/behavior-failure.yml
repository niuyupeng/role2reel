name: Behavior failure
description: Report meaning drift, unnatural dialogue, knowledge leakage, empty shot duty, or asset leakage.
title: "[Behavior]: "
labels: ["behavior"]
body:
  - type: markdown
    attributes:
      value: Please remove confidential scripts, personal data, faces, voices, and unreleased production assets.
  - type: dropdown
    id: stage
    attributes:
      label: Stage
      options:
        - Humanization
        - Character runtime
        - Dialogue or scene
        - Storyboard
        - Video-model adapter
        - Routing or scope restraint
    validations:
      required: true
  - type: textarea
    id: minimal-input
    attributes:
      label: Minimal reproducible input
      description: Use invented or licensed material only.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Candidate output
    validations:
      required: true
  - type: textarea
    id: human-final
    attributes:
      label: Human-approved final version
      description: Optional but especially valuable.
  - type: textarea
    id: reason
    attributes:
      label: Why it failed
      description: Name the observable failure, not only “it feels unnatural.”
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Model and environment
      placeholder: Codex model, reasoning setting, Role2Reel commit
    validations:
      required: true
