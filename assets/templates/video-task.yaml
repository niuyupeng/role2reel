# Every consumed media source must point to one of these uses by `use_id`.
# A valid use resolves to asset-contract.borrow_authorizations, targets OUTPUT,
# covers the exact consumed output interval, and borrows the literal mode role:
# conditioning | extension_source | edit_source | transition_source_a |
# transition_source_b | panel_source.
# Example:
# - use_id: USE-CLIP-A
#   authorization_id: AUTH-CLIP-A
#   source_ref: {asset_id: CLIP-A, revision: 1}
#   borrow: [edit_source]
#   targets: [OUTPUT]
#   interval: {start_s: 0.0, end_s: 4.0}
reference_uses: []
