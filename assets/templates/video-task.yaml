  - segment_id: T001
    start_s: 0.0
    end_s: null
    observable_event: null
    state_in: null
    state_out: null
    camera: null
    performance: null
    sound: null
    asset_refs: []
# Fill exactly one mode contract. Every media ref inside it has the shape
# {asset_id: ..., revision: ..., use_id: ...}; the matching use above is not
# optional. Transition contracts include
# source_a_protected_interval, bridge_window, and source_b_protected_interval.
# Multi-panel entries include binding_properties and excluded_properties, while
# the contract sets unrequested_additions.policy: deny and explicitly lists
# cta, logo, and decorative_effects among its denied categories.
# Example edit source binding:
# mode_contracts:
#   edit:
#     source_clip_ref: {asset_id: CLIP-A, revision: 1, use_id: USE-CLIP-A}
#     protected_elements: [identity, background, voice]
#     targets:
#       - target_id: wardrobe-color
#         operation: change only the declared color
#         interval: {start_s: 0.0, end_s: 4.0}
#         preserve: [shape, motion, occlusion]
mode_contracts: {}
targeted_exclusions: []
handoff_state: null
